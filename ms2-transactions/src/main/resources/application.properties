spring.config.import=optional:file:../.env[.properties]
server.port=8082

spring.application.name=ms2-transactions

spring.datasource.url=${DB_URL_MS2}
spring.datasource.username=${DB_USER_MS2}
spring.datasource.password=${DB_PASSWORD_MS2}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

brasil.api.url=https://brasilapi.com.br/api
app.client.mock-api-url=https://6aee04e3a677fe0fc14fb383.mockapi.io/api/v1/
ms1.service.url=http://localhost:8080

jwt.secret=${JWT_SECRET}