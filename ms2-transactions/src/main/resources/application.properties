spring.config.import=optional:file:../.env[.properties]
server.port=8082

spring.application.name=ms2-transactions

spring.datasource.url=${DB_URL_MS2}
spring.datasource.username=${DB_USER_MS2}
spring.datasource.password=${DB_PASSWORD_MS2}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.client.mock-api-url=https://api.mock-exemplo.com/users/