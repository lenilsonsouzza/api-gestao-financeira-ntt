services:
  postgres-ms1:
    image: postgres:15-alpine
    container_name: postgres_ms1_users
    environment:
      POSTGRES_DB: db_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_ms1:/var/lib/postgresql/data
    networks:
      - rede-financeira

  postgres-ms2:
    image: postgres:15-alpine
    container_name: postgres_ms2_transactions
    environment:
      POSTGRES_DB: db_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_ms2:/var/lib/postgresql/data
    networks:
      - rede-financeira


  # Aplicação MS1 (Usuários)

  ms1-usuarios:
    build:
      context: ./ms1-usuarios
      dockerfile: Dockerfile
    container_name: ms1_usuarios_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ms1:5432/db_users
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres-ms1
    networks:
      - rede-financeira

  # Aplicação MS2 (Transações)

  ms2-transactions:
    build:
      context: ./ms2-transactions
      dockerfile: Dockerfile
    container_name: ms2_transactions_app
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ms2:5432/db_transactions
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres-ms2
    networks:
      - rede-financeira

volumes:
  pgdata_ms1:
  pgdata_ms2:

networks:
  rede-financeira:
    driver: bridge